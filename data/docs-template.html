<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MSH Command Documentation</title>
        <link
            rel="icon"
            href="https://raw.githubusercontent.com/cophilot/msh/refs/heads/main/assets/logo.png"
            type="image/x-icon" />
        <link
            rel="shortcut icon"
            href="https://raw.githubusercontent.com/cophilot/msh/refs/heads/main/assets/logo.png"
            type="image/x-icon" />

        <style>
            @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

            :root {
                --bg: #0a0e1a;
                --panel: #121828;
                --panel-light: #1b2335;
                --panel-lighter: #242e45;
                --accent: #7ee787;
                --accent-dim: #7ee78722;
                --accent-contrast: #06240f;
                --text: #eef1f8;
                --muted: #8b96b3;
                --muted-dim: #5c6684;
                --border: #232c42;
                --danger: #f97583;
                --shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
                --radius: 10px;
                --mono: 'JetBrains Mono', ui-monospace, monospace;
                --sans: 'Inter', system-ui, sans-serif;
                font-family: var(--sans);
                color-scheme: dark;
            }

            [data-theme='light'] {
                --bg: #f4f6fb;
                --panel: #ffffff;
                --panel-light: #eef1f8;
                --panel-lighter: #e3e8f4;
                --accent: #0f9d58;
                --accent-dim: #0f9d5822;
                --accent-contrast: #ffffff;
                --text: #101425;
                --muted: #5b6478;
                --muted-dim: #8b96b3;
                --border: #dde2ef;
                --shadow: 0 12px 30px rgba(20, 30, 60, 0.12);
                color-scheme: light;
            }

            * {
                box-sizing: border-box;
            }

            *:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
            }

            @media (prefers-reduced-motion: reduce) {
                * {
                    animation: none !important;
                    transition: none !important;
                }
            }

            html,
            body {
                height: 100%;
            }

            body {
                margin: 0;
                background: var(--bg);
                color: var(--text);
                display: flex;
                overflow: hidden;
                transition:
                    background 0.2s,
                    color 0.2s;
            }

            button {
                font-family: inherit;
            }

            /* =======================================================
               Sidebar
               ======================================================= */

            aside {
                width: 340px;
                min-width: 340px;
                background: var(--panel);
                border-right: 1px solid var(--border);
                display: flex;
                flex-direction: column;
                transition:
                    transform 0.25s ease,
                    background 0.2s;
                z-index: 20;
            }

            header {
                padding: 18px 18px 14px;
                border-bottom: 1px solid var(--border);
            }

            .header-top {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 4px;
            }

            .brand {
                display: flex;

                align-items: center;
                gap: 8px;
            }

            .brand h1 {
                margin: 0;
                font-size: 19px;
                letter-spacing: -0.01em;
            }

            .brand .count {
                font-family: var(--mono);
                font-size: 12px;
                color: var(--muted);
            }

            .icon-btn {
                border: 1px solid var(--border);
                background: var(--panel-light);
                color: var(--muted);
                width: 30px;
                height: 30px;
                border-radius: 8px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 14px;
                transition: 0.15s;
            }

            .icon-btn:hover {
                color: var(--text);
                border-color: var(--muted-dim);
            }

            .search-row {
                position: relative;
                margin-top: 12px;
            }

            .search-row .prompt-glyph {
                position: absolute;
                left: 12px;
                top: 50%;
                transform: translateY(-50%);
                color: var(--accent);
                font-family: var(--mono);
                font-weight: 700;
                pointer-events: none;
            }

            #search {
                width: 100%;
                padding: 10px 54px 10px 30px;
                border-radius: 8px;
                border: 1px solid var(--border);
                background: var(--panel-light);
                color: var(--text);
                font-family: var(--mono);
                font-size: 13.5px;
                transition:
                    border-color 0.15s,
                    background 0.15s;
            }

            #search::placeholder {
                color: var(--muted-dim);
            }

            #search:focus {
                border-color: var(--accent);
                background: var(--panel-lighter);
            }

            .kbd-hint {
                position: absolute;
                right: 8px;
                top: 50%;
                transform: translateY(-50%);
                font-family: var(--mono);
                font-size: 10.5px;
                color: var(--muted-dim);
                background: var(--panel);
                border: 1px solid var(--border);
                padding: 2px 6px;
                border-radius: 5px;
                pointer-events: none;
            }

            .filters-row {
                display: flex;
                gap: 8px;
                margin-top: 10px;
            }

            #sort {
                flex: 1;
                padding: 8px 10px;
                border-radius: 8px;
                border: 1px solid var(--border);
                background: var(--panel-light);
                color: var(--text);
                font-size: 12.5px;
                cursor: pointer;
            }

            #commandList {
                overflow-y: auto;
                flex: 1;
                padding-bottom: 12px;
            }

            #commandList:focus {
                outline: none;
            }

            .group {
                border-bottom: 1px solid var(--border);
            }

            .group-title {
                padding: 10px 18px;
                font-size: 11.5px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                color: var(--muted);
                background: transparent;
                cursor: pointer;
                user-select: none;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                position: sticky;
                top: 0;
                background: var(--panel);
                z-index: 1;
            }

            .group-title:hover {
                color: var(--text);
            }

            .group-title .chevron {
                transition: transform 0.15s;
                font-size: 10px;
                color: var(--muted-dim);
            }

            .group-title.collapsed .chevron {
                transform: rotate(-90deg);
            }

            .group-title .group-count {
                font-family: var(--mono);
                font-weight: 500;
                color: var(--muted-dim);
                background: var(--panel-light);
                padding: 1px 7px;
                border-radius: 999px;
                font-size: 10.5px;
                margin-right: auto;
                margin-left: 8px;
            }

            .command {
                padding: 9px 18px 9px 22px;
                cursor: pointer;
                border-left: 2px solid transparent;
                transition:
                    background 0.12s,
                    border-color 0.12s;
                display: flex;
                flex-direction: column;
                gap: 2px;
            }

            .command:hover {
                background: var(--panel-light);
            }

            .command.active {
                border-left-color: var(--accent);
                background: var(--accent-dim);
            }

            .command.keyboard-focus {
                background: var(--panel-lighter);
            }

            .command .cmd-name {
                font-family: var(--mono);
                font-size: 13px;
                font-weight: 600;
                color: var(--text);
            }

            .command .cmd-name::before {
                content: '›';
                color: var(--accent);
                margin-right: 5px;
                font-weight: 700;
            }

            .command .cmd-meta {
                font-size: 11px;
                color: var(--muted-dim);
                font-family: var(--mono);
                padding-left: 15px;
            }

            mark {
                background: var(--accent);
                color: var(--accent-contrast);
                border-radius: 2px;
                padding: 0 1px;
            }

            .no-results {
                padding: 40px 24px;
                text-align: center;
                color: var(--muted);
                font-size: 13px;
                line-height: 1.6;
            }

            .no-results .big {
                font-size: 26px;
                display: block;
                margin-bottom: 8px;
            }

            .sidebar-footer {
                padding: 10px 18px;
                border-top: 1px solid var(--border);
                font-size: 10.5px;
                color: var(--muted-dim);
                font-family: var(--mono);
                display: flex;
                gap: 14px;
                flex-wrap: wrap;
            }

            .sidebar-footer kbd {
                background: var(--panel-light);
                border: 1px solid var(--border);
                border-radius: 4px;
                padding: 1px 5px;
                font-family: var(--mono);
                color: var(--muted);
            }

            /* =======================================================
               Main
               ======================================================= */

            main {
                flex: 1;
                overflow-y: auto;
                padding: 44px 40px;
                position: relative;
            }

            .mobile-topbar {
                display: none;
                align-items: center;
                gap: 10px;
                margin-bottom: 18px;
            }

            .card {
                max-width: 880px;
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 32px 36px;
                box-shadow: var(--shadow);
                animation: rise 0.2s ease;
            }

            @keyframes rise {
                from {
                    opacity: 0;
                    transform: translateY(6px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .title-row {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                gap: 20px;
                flex-wrap: wrap;
            }

            .title-row h2 {
                margin: 0;
                font-family: var(--mono);
                font-size: 23px;
                letter-spacing: -0.01em;
                word-break: break-word;
            }

            .title-row h2::before {
                content: '›';
                color: var(--accent);
                margin-right: 8px;
            }

            .button-group {
                display: flex;
                gap: 8px;
                flex-shrink: 0;
            }

            .copy-btn {
                border: 1px solid transparent;
                background: var(--accent);
                color: var(--accent-contrast);
                border-radius: 8px;
                padding: 8px 14px;
                cursor: pointer;
                font-weight: 600;
                font-size: 13px;
                transition:
                    filter 0.15s,
                    transform 0.1s;
                white-space: nowrap;
            }

            .copy-btn:hover {
                filter: brightness(1.08);
            }

            .copy-btn:active {
                transform: scale(0.97);
            }

            .copy-btn.secondary {
                background: transparent;
                border-color: var(--border);
                color: var(--muted);
            }

            .copy-btn.secondary:hover {
                color: var(--text);
                border-color: var(--muted-dim);
            }

            .meta {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                margin: 18px 0;
            }

            .badge {
                background: var(--panel-light);
                border: 1px solid var(--border);
                padding: 5px 11px;
                border-radius: 999px;
                font-size: 12px;
                color: var(--muted);
            }

            .badge.tag {
                color: var(--accent);
                border-color: var(--accent-dim);
            }

            .meta-row {
                display: flex;
                align-items: center;
                gap: 10px;
                margin: 18px 0;
                color: var(--muted);
                font-size: 13px;
                flex-wrap: wrap;
            }

            .meta-label {
                font-weight: 600;
                color: var(--text);
            }

            .path {
                font-family: var(--mono);
                background: var(--panel-light);
                border: 1px solid var(--border);
                padding: 5px 10px;
                border-radius: 6px;
                color: var(--text);
                font-size: 12.5px;
            }

            .path-copy {
                background: none;
                border: none;
                color: var(--muted);
                cursor: pointer;
                font-size: 13px;
                padding: 2px 4px;
            }

            .path-copy:hover {
                color: var(--accent);
            }

            h3.section-label {
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                color: var(--muted);
                margin: 26px 0 10px;
            }

            .description {
                line-height: 1.75;
                font-size: 15px;
                color: var(--text);
            }

            .empty-state {
                max-width: 460px;
                margin: 12vh auto 0;
                text-align: center;
                color: var(--muted);
            }

            .empty-state .glyph {
                font-family: var(--mono);
                font-size: 40px;
                color: var(--accent);
                margin-bottom: 12px;
                display: block;
            }

            .empty-state h2 {
                color: var(--text);
                font-size: 18px;
                margin: 0 0 8px;
            }

            .empty-state p {
                font-size: 14px;
                line-height: 1.6;
                margin: 0;
            }

            /* =======================================================
               Overlay for mobile
               ======================================================= */

            .backdrop {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.5);
                z-index: 15;
            }

            .backdrop.visible {
                display: block;
            }

            @media (max-width: 820px) {
                aside {
                    position: fixed;
                    inset: 0 auto 0 0;
                    transform: translateX(-100%);
                }

                aside.open {
                    transform: translateX(0);
                }

                .mobile-topbar {
                    display: flex;
                }

                main {
                    padding: 20px 18px 40px;
                }

                .card {
                    padding: 22px 20px;
                }
            }
        </style>
    </head>

    <body>
        <div class="backdrop" id="backdrop"></div>

        <aside id="sidebar" aria-label="Command list">
            <header>
                <div class="header-top">
                    <div class="brand">
                        <img
                            src="https://raw.githubusercontent.com/cophilot/msh/refs/heads/main/assets/logo.png"
                            alt="MSH Logo"
                            width="30"
                            height="30" />
                        <h1>Commands</h1>
                        <span class="count" id="totalCount"></span>
                    </div>
                    <button
                        class="icon-btn"
                        id="themeToggle"
                        title="Toggle light / dark theme"
                        aria-label="Toggle theme">
                        ◐
                    </button>
                </div>

                <div class="search-row">
                    <span class="prompt-glyph">/</span>
                    <input
                        id="search"
                        placeholder="Search commands, tags, paths…"
                        aria-label="Search commands"
                        autocomplete="off" />
                    <span class="kbd-hint" id="searchHint">⌘K</span>
                </div>

                <div class="filters-row">
                    <select id="sort" aria-label="Sort order">
                        <option value="name">Sort by name</option>
                        <option value="timestamp">Sort by newest</option>
                    </select>
                </div>
            </header>

            <div id="commandList" tabindex="0"></div>

            <div class="sidebar-footer">
                <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
                <span><kbd>↵</kbd> open</span>
                <span><kbd>Esc</kbd> clear</span>
            </div>
        </aside>

        <main>
            <div class="mobile-topbar">
                <button
                    class="icon-btn"
                    id="openSidebar"
                    aria-label="Open command list">
                    ☰
                </button>
                <strong>Commands</strong>
            </div>

            <div id="details">
                <div class="empty-state">
                    <span class="glyph">›_</span>
                    <h2>Select a command</h2>
                    <p>
                        Choose a command from the list on the left, or press
                        <kbd style="font-family: var(--mono)">/</kbd> to search
                        by name, tag, or path.
                    </p>
                </div>
            </div>
        </main>

        <script>
            // =======================================================
            // COMMAND DATA
            // =======================================================

            const commands = [
                //%%%DATA%%%
            ];

            // =======================================================
            // STATE
            // =======================================================

            const list = document.getElementById('commandList');
            const details = document.getElementById('details');
            const search = document.getElementById('search');
            const sort = document.getElementById('sort');
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('backdrop');
            const themeToggle = document.getElementById('themeToggle');

            let active = null;
            let collapsedGroups = new Set();
            let currentFlatList = [];
            let keyboardIndex = -1;

            document.getElementById('totalCount').textContent =
                commands.length +
                (commands.length === 1 ? ' command' : ' commands');

            // =======================================================
            // THEME
            // =======================================================

            themeToggle.onclick = () => {
                const isLight =
                    document.documentElement.getAttribute('data-theme') ===
                    'light';
                document.documentElement.setAttribute(
                    'data-theme',
                    isLight ? '' : 'light',
                );
                themeToggle.textContent = isLight ? '◐' : '◑';
            };

            // =======================================================
            // MOBILE SIDEBAR
            // =======================================================

            document.getElementById('openSidebar').onclick = () => {
                sidebar.classList.add('open');
                backdrop.classList.add('visible');
            };

            backdrop.onclick = () => {
                sidebar.classList.remove('open');
                backdrop.classList.remove('visible');
            };

            function closeSidebarOnMobile() {
                sidebar.classList.remove('open');
                backdrop.classList.remove('visible');
            }

            // =======================================================
            // HIGHLIGHT HELPER
            // =======================================================

            function escapeHtml(str) {
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
            }

            function highlight(text, query) {
                const safe = escapeHtml(text);
                if (!query) return safe;
                const idx = safe.toLowerCase().indexOf(query.toLowerCase());
                if (idx === -1) return safe;
                return (
                    safe.slice(0, idx) +
                    '<mark>' +
                    safe.slice(idx, idx + query.length) +
                    '</mark>' +
                    safe.slice(idx + query.length)
                );
            }

            // =======================================================
            // DETAILS
            // =======================================================

            function renderDetails(command) {
                const tags = Array.isArray(command.tags)
                    ? command.tags
                    : String(command.tags)
                          .split(',')
                          .map((t) => t.trim())
                          .filter(Boolean);

                details.innerHTML = `
                    <div class="card">
                        <div class="title-row">
                            <h2>${escapeHtml(command.name)}</h2>
                            <div class="button-group">
                                <button class="copy-btn secondary" data-copy="${escapeHtml(command.path || '')}">
                                    Copy path
                                </button>
                                <button class="copy-btn" data-copy="${escapeHtml(command.name)}">
                                    📋 Copy command
                                </button>
                            </div>
                        </div>

                        <div class="meta">
                            <span class="badge">${escapeHtml(command.collection)}</span>
                            ${tags.map((t) => `<span class="badge tag">${escapeHtml(t)}</span>`).join('')}
                            <span class="badge">${escapeHtml(command.created)}</span>
                        </div>

                        <div class="meta-row">
                            <span class="meta-label">Path</span>
                            <span class="path">${escapeHtml(command.path)}</span>
                            <button class="path-copy" data-copy="${escapeHtml(command.path || '')}" title="Copy path" aria-label="Copy path">⧉</button>
                        </div>

                        <h3 class="section-label">Description</h3>
                        <div class="description">${command.description}</div>
                    </div>
                `;

                details.querySelectorAll('[data-copy]').forEach((btn) => {
                    btn.addEventListener('click', () => copyToClipboard(btn));
                });
            }

            async function copyToClipboard(button) {
                const value = button.getAttribute('data-copy');
                try {
                    await navigator.clipboard.writeText(value);
                } catch (err) {
                    // clipboard API unavailable — fail silently, button still gives feedback
                }
                const oldText = button.innerHTML;
                button.innerHTML =
                    button.classList.contains('copy-btn') &&
                    !button.classList.contains('secondary')
                        ? '✓ Copied'
                        : '✓';
                button.disabled = true;
                setTimeout(() => {
                    button.innerHTML = oldText;
                    button.disabled = false;
                }, 1100);
            }

            // =======================================================
            // LIST RENDERING
            // =======================================================

            function getFiltered() {
                let filtered = [...commands];
                const query = search.value.trim().toLowerCase();

                if (query) {
                    filtered = filtered.filter((command) => {
                        const tagsStr = Array.isArray(command.tags)
                            ? command.tags.join(' ')
                            : String(command.tags || '');
                        return (
                            command.name.toLowerCase().includes(query) ||
                            String(command.description)
                                .toLowerCase()
                                .includes(query) ||
                            command.collection.toLowerCase().includes(query) ||
                            command.path.toLowerCase().includes(query) ||
                            tagsStr.toLowerCase().includes(query)
                        );
                    });
                }

                if (sort.value === 'name') {
                    filtered.sort((a, b) => a.name.localeCompare(b.name));
                } else {
                    filtered.sort((a, b) =>
                        String(b.created).localeCompare(String(a.created)),
                    );
                }

                return { filtered, query };
            }

            function renderList(preserveKeyboardIndex) {
                const { filtered, query } = getFiltered();

                if (!preserveKeyboardIndex) keyboardIndex = -1;

                if (filtered.length === 0) {
                    list.innerHTML = `
                        <div class="no-results">
                            <span class="big">∅</span>
                            No commands match “${escapeHtml(search.value)}”.<br />
                            Try a different name, tag, or path.
                        </div>
                    `;
                    currentFlatList = [];
                    return;
                }

                const grouped = {};
                filtered.forEach((command) => {
                    if (!grouped[command.collection])
                        grouped[command.collection] = [];
                    grouped[command.collection].push(command);
                });

                list.innerHTML = '';
                currentFlatList = [];

                Object.keys(grouped)
                    .sort()
                    .forEach((group) => {
                        const wrapper = document.createElement('div');
                        wrapper.className = 'group';

                        const isCollapsed = collapsedGroups.has(group);

                        const title = document.createElement('div');
                        title.className =
                            'group-title' + (isCollapsed ? ' collapsed' : '');
                        title.innerHTML = `
                            <span class="chevron">▾</span>
                            <span>${escapeHtml(group)}</span>
                            <span class="group-count">${grouped[group].length}</span>
                        `;

                        const container = document.createElement('div');
                        container.style.display = isCollapsed ? 'none' : '';

                        grouped[group].forEach((command) => {
                            const item = document.createElement('div');
                            item.className = 'command';
                            item.setAttribute('role', 'button');
                            item.setAttribute('tabindex', '-1');

                            if (active === command)
                                item.classList.add('active');

                            item.innerHTML = `
                                <span class="cmd-name">${highlight(command.name, query)}</span>
                                <span class="cmd-meta">${escapeHtml(command.collection)} · ${escapeHtml(command.created)}</span>
                            `;

                            item.onclick = () => {
                                selectCommand(command, item);
                                closeSidebarOnMobile();
                            };

                            container.appendChild(item);
                            currentFlatList.push({ command, el: item });
                        });

                        title.onclick = () => {
                            if (collapsedGroups.has(group)) {
                                collapsedGroups.delete(group);
                            } else {
                                collapsedGroups.add(group);
                            }
                            renderList();
                        };

                        wrapper.appendChild(title);
                        wrapper.appendChild(container);
                        list.appendChild(wrapper);
                    });

                if (keyboardIndex >= 0 && currentFlatList[keyboardIndex]) {
                    currentFlatList[keyboardIndex].el.classList.add(
                        'keyboard-focus',
                    );
                }
            }

            function selectCommand(command, el) {
                active = command;
                renderList(true);
                renderDetails(command);
            }

            // =======================================================
            // KEYBOARD NAVIGATION
            // =======================================================

            document.addEventListener('keydown', (e) => {
                const tag = document.activeElement.tagName;
                const isTyping =
                    tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA';

                // Focus search with "/" or Cmd/Ctrl+K
                if (
                    (e.key === '/' && !isTyping) ||
                    ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k')
                ) {
                    e.preventDefault();
                    search.focus();
                    search.select();
                    return;
                }

                if (e.key === 'Escape') {
                    if (document.activeElement === search && search.value) {
                        search.value = '';
                        renderList();
                    }
                    search.blur();
                    return;
                }

                const withinListContext =
                    document.activeElement === search ||
                    document.activeElement === list;
                if (!withinListContext) return;

                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (currentFlatList.length === 0) return;
                    keyboardIndex = Math.min(
                        keyboardIndex + 1,
                        currentFlatList.length - 1,
                    );
                    renderList(true);
                    currentFlatList[keyboardIndex].el.scrollIntoView({
                        block: 'nearest',
                    });
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (currentFlatList.length === 0) return;
                    keyboardIndex = Math.max(keyboardIndex - 1, 0);
                    renderList(true);
                    currentFlatList[keyboardIndex].el.scrollIntoView({
                        block: 'nearest',
                    });
                } else if (e.key === 'Enter') {
                    if (keyboardIndex >= 0 && currentFlatList[keyboardIndex]) {
                        e.preventDefault();
                        const { command, el } = currentFlatList[keyboardIndex];
                        selectCommand(command, el);
                        closeSidebarOnMobile();
                    }
                }
            });

            document.getElementById('searchHint').textContent =
                navigator.platform.toLowerCase().includes('mac')
                    ? '⌘K'
                    : 'Ctrl K';

            // =======================================================

            search.oninput = () => renderList();
            sort.onchange = () => renderList(true);

            renderList();
        </script>
    </body>
</html>
